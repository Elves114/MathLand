<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MathLab — calculadora de matemática do básico ao intermediário: aritmética, frações, porcentagem, álgebra, geometria e estatística.">
  <title>MathLab — Calculadora de Matemática</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>∑</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">∑</span>
      <div class="brand-text">
        <strong>MathLab</strong>
        <span>Matemática do básico ao intermediário</span>
      </div>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm10 2-4.35-4.35"/>
      </svg>
      <input id="search" type="search" autocomplete="off"
             placeholder="Pesquisar operação… (ex.: Bhaskara, frações, área, média)">
    </div>

    <div class="topbar-stats" id="topbar-stats"></div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <p class="sidebar-title">Matérias</p>
      <nav id="categories" class="categories" aria-label="Categorias"></nav>
    </aside>

    <main class="content">
      <section class="hero">
        <h1 id="category-name">A carregar…</h1>
        <p id="category-description"></p>
      </section>

      <p id="search-info" class="search-info" hidden></p>

      <section id="operations" class="ops-grid" aria-live="polite"></section>

      <div id="empty" class="empty" hidden>
        <span class="empty-icon" aria-hidden="true">🔎</span>
        <p><strong>Nenhuma operação encontrada.</strong></p>
        <p>Tenta outra palavra ou limpa a pesquisa.</p>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-desc">
      <button class="modal-close" id="modal-close" aria-label="Fechar" type="button">×</button>
      <span class="modal-tag" id="modal-tag"></span>
      <h2 id="modal-title"></h2>
      <p class="modal-desc" id="modal-desc"></p>

      <form id="calc-form" novalidate>
        <div class="fields" id="form-fields"></div>
        <div class="form-actions">
          <button class="btn-primary" id="submit-btn" type="submit">Calcular</button>
          <button class="btn-ghost" id="reset-btn" type="button">Limpar</button>
        </div>
      </form>

      <div class="result" id="result" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    </div>
  </div>

  <footer class="footer">
    <span>MathLab</span> · backend <strong>Python (Flask)</strong> · front <strong>HTML + CSS + JavaScript</strong>
  </footer>

  <script src="app.js"></script>
</body>
</html>
